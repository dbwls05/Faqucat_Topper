<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facucat - Congratulations</title>
    <link rel="stylesheet" href="css/common.css">

<body>

    <div class="container">

        <div class="top-row">

            <img src="img/(광고)물불게임.gif" class="gif" alt="">

                <div class="clear-popup-overlay">

                </div>

            <img src="img/(광고)라면가게.gif" class="gif">
        </div>

        <div class="bottom-row">
            <img src="img/내가만든거 아님.png" class="ad" alt="">
